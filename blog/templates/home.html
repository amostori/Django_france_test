{% extends "index.html" %}
{% block content %}

<form  method="POST" id="signup-form" >
	{% csrf_token %}
	<input type="text" name="post_text" id="email" placeholder="Saisissez une expression" />
	<input type="submit" value="Sauvegarder" />
</form>
<header>
{% for post in all_posts %}
    <p>{{ post.post_text }}   <a href="{% url 'delete' post.id %}">  Delete</a></p>
{% endfor %}

{% endblock content %}
</header>
